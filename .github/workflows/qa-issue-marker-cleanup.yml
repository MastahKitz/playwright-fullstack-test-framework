name: QA Issue and Marker Cleanup

# Runs after "Playwright Tests" finishes, on both success and failure. Scans the
# suite for KNOWN-FAILURE(#N) markers whose guarded test passed cleanly in that
# run and opens a PR removing them (and closing / commenting on the linked
# issues). The failure-direction counterpart is qa-results-analysis.yml.
#
# Same workflow_run indirection as qa-results-analysis.yml: playwright.yml runs
# on `push`, which claude-code-action can't be triggered by, so this watches the
# "Playwright Tests" workflow_run event instead and pulls its report artifact.
on:
  workflow_run:
    workflows: ['Playwright Tests']
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

# One shared no-cancel group with qa-results-analysis so the two triage
# workflows can never race. Trade-off: a cleanup waits behind an unrelated
# analysis. Acceptable at this repo's push rate.
concurrency:
  group: qa-triage-automation
  cancel-in-progress: false

jobs:
  cleanup:
    # Skip cancelled / skipped upstream runs — only act on a real pass or fail.
    if: >
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download test report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: test-report/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure triage labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh label create qa-triage --force \
            --color BFD4F2 --description "Opened by the QA triage automation"
          gh label create qa-triage:cleanup --force \
            --color 0E8A16 --description "QA triage — marker-removal PR"

      # The same shared inventory builder the analysis workflow uses — all five
      # lists. Cleanup needs the PR lists too: cleanup_prs for the dedup check,
      # triage_prs / decision_prs for the "don't close an issue a pending PR
      # still references" check.
      - name: Build tracking inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue list --state open --label qa-triage --limit 200 \
            --json number,title,body > issues.json
          gh pr list --state open --label qa-triage --limit 200 \
            --json number,title,headRefName,body,labels > prs.json
          grep -rn --include='*.ts' 'KNOWN-FAILURE(#' tests/functional/ > markers.txt || true
          node scripts/build-tracking-inventory.js \
            issues.json prs.json markers.txt > tracking-inventory.json
          rm -f issues.json prs.json markers.txt
          echo "::group::tracking-inventory.json"
          cat tracking-inventory.json
          echo "::endgroup::"

      - name: Load issue and marker cleanup prompt
        run: |
          {
            echo 'ISSUE_MARKER_CLEANUP_PROMPT<<PROMPT_EOF'
            cat .github/prompts/qa-issue-marker-cleanup.md
            echo PROMPT_EOF
          } >> "$GITHUB_ENV"

      - name: Retire markers whose tests now pass
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            RUN ID: ${{ github.event.workflow_run.id }}
            RUN URL: ${{ github.event.workflow_run.html_url }}
            COMMIT: ${{ github.event.workflow_run.head_sha }}

            ${{ env.ISSUE_MARKER_CLEANUP_PROMPT }}

          claude_args: |
            --allowedTools "Read,Grep,Glob,Edit,Bash(git checkout:*),Bash(git config:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh issue view:*),Bash(gh issue comment:*)"
