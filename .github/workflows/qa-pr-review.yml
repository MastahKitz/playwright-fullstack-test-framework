name: QA PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Test code only — the conventions doc only covers tests/**.
    paths:
      - 'tests/**'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # This repo's own automation commits as qa-test-gen-bot / qa-triage-bot (see
      # .github/prompts/qa-test-generation.md, qa-results-analysis.md) — those PRs
      # already had conventions.md fed into their own generation, so a second bot
      # re-checking the same content against the same doc is redundant. What
      # actually needs review is any commit *not* from those identities, whoever
      # opened the PR — so this checks every commit currently on the PR rather
      # than just who opened it, and skips only while all of them are still
      # bot-only. The moment a human pushes their own commit onto a bot-opened
      # PR, this flips and review runs against it, same as any other PR.
      - name: Check whether every commit on this PR is still bot-only
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          all_bot=true
          while IFS= read -r email; do
            case "$email" in
              qa-test-gen-bot@users.noreply.github.com|qa-triage-bot@users.noreply.github.com) ;;
              *) all_bot=false ;;
            esac
          done < <(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" --jq '.[].commit.author.email')
          echo "all_bot=$all_bot" >> "$GITHUB_OUTPUT"

      - name: Load review prompt
        if: steps.gate.outputs.all_bot != 'true'
        # The prompt references docs/conventions.md as the source of truth; inline it
        # here so the conventions are guaranteed to be in context, not just fetchable.
        run: |
          {
            echo 'PR_REVIEW_PROMPT<<PROMPT_EOF'
            cat .github/prompts/qa-pr-review.md
            echo
            echo '---'
            echo '# docs/conventions.md'
            echo
            cat docs/conventions.md
            echo PROMPT_EOF
          } >> "$GITHUB_ENV"

      - name: Review PR against test framework conventions
        if: steps.gate.outputs.all_bot != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Generated via `claude setup-token` (uses your Claude subscription, no separate
          # API billing). Swap for `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`
          # if you'd rather use Console API billing instead.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ env.PR_REVIEW_PROMPT }}

          # `gh api ... /pulls/<n>/comments` lets the review reconcile against its
          # own prior inline comments (it re-runs on every `synchronize`).
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"
