name: QA PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Test code only — the conventions doc only covers tests/**.
    paths:
      - 'tests/**'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # Skip the triage / decision / cleanup PRs this system opens (all carry the
    # `qa-triage` label) — the reviewer must never lint its own machinery's
    # output. The bot-actor guard is a belt-and-braces second check
    # (claude-code-action refuses to run for a bot actor anyway).
    if: >
      github.event.pull_request.user.type != 'Bot' &&
      !contains(github.event.pull_request.labels.*.name, 'qa-triage')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load review prompt
        # The prompt references docs/conventions.md as the source of truth; inline it
        # here so the conventions are guaranteed to be in context, not just fetchable.
        run: |
          {
            echo 'PR_REVIEW_PROMPT<<PROMPT_EOF'
            cat .github/prompts/qa-pr-review.md
            echo
            echo '---'
            echo '# docs/conventions.md'
            echo
            cat docs/conventions.md
            echo PROMPT_EOF
          } >> "$GITHUB_ENV"

      - name: Review PR against test framework conventions
        uses: anthropics/claude-code-action@v1
        with:
          # Generated via `claude setup-token` (uses your Claude subscription, no separate
          # API billing). Swap for `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`
          # if you'd rather use Console API billing instead.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ env.PR_REVIEW_PROMPT }}

          # `gh api ... /pulls/<n>/comments` lets the review reconcile against its
          # own prior inline comments (it re-runs on every `synchronize`).
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"
