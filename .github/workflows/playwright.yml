name: Playwright Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

# qademo is a small shared demo server — the suite already runs single-worker
# for that reason (playwright.config.ts). Queue runs so two never hammer its API
# at once, rather than cancelling in-progress runs.
concurrency:
  group: qademo-qa-e2e
  cancel-in-progress: false

permissions:
  contents: write   # the dashboard step force-pushes the report site to gh-pages

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QA_STANDARD_USER_USERNAME: ${{ secrets.QA_STANDARD_USER_USERNAME }}
      QA_STANDARD_USER_PASSWORD: ${{ secrets.QA_STANDARD_USER_PASSWORD }}
      QA_LOCKED_USER_USERNAME: ${{ secrets.QA_LOCKED_USER_USERNAME }}
      QA_LOCKED_USER_PASSWORD: ${{ secrets.QA_LOCKED_USER_PASSWORD }}
      QA_ADMIN_USER_USERNAME: ${{ secrets.QA_ADMIN_USER_USERNAME }}
      QA_ADMIN_USER_PASSWORD_PREFIX: ${{ secrets.QA_ADMIN_USER_PASSWORD_PREFIX }}
    steps:
      # Check out the repo at the pushed commit so the workflow can run its code.
      - uses: actions/checkout@v4

      # Install Node.js 20 and put it on PATH for later steps.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install exact dependency versions from package-lock.json (clean, reproducible install).
      - name: Install dependencies
        run: npm ci

      # Download the Chromium build Playwright needs, plus its OS-level libraries.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Run the end-to-end suite against the live demo site.
      - name: Run Playwright tests
        run: npx playwright test

      # Post-process the run's results and fail the build if any test only passed on retry.
      - name: Fail build if any test was flaky
        run: node scripts/check-flaky.js test-report/results.json

      # Publish the HTML report as a downloadable artifact, even when earlier steps failed.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-report/
          retention-days: 14

      # Upload the screenshots/traces/videos from failed tests only when the run
      # failed. Consumed by the AI failure-triage workflow, which runs in a
      # separate job (workflow_run) since Claude Code Action doesn't support the
      # `push` event this job runs on.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

      # ---------------------------------------------------------------------
      # Publish this run to the GitHub Pages dashboard: last 5 runs with their
      # counts and a link to each run's full HTML report, served inline so there
      # is nothing to download. Runs even when tests failed, so the dashboard
      # always reflects the latest state.
      # ---------------------------------------------------------------------

      # Grab the currently-published site so the builder can carry the four most
      # recent prior reports forward. First ever run: the branch doesn't exist,
      # so this is allowed to fail and the builder starts from an empty list.
      - name: Check out existing dashboard
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build dashboard site
        if: always()
        run: node scripts/build-report-dashboard.js test-report/results.json test-report gh-pages public

      # Force-push the assembled ./public wholesale — the branch only ever holds
      # the last 5 runs, so purging is automatic.
      - name: Publish dashboard to gh-pages
        if: always()
        working-directory: public
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "test dashboard: run #${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
