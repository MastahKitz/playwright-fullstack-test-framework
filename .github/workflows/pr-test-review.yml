name: PR Test Framework Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tests/**'
      - 'playwright.config.ts'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # Skip PRs opened by bots (e.g. the known-failure marker PRs from
    # test-failure-analysis.yml) — this review is for human-authored test
    # changes, and claude-code-action refuses to run for a bot actor anyway.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load review prompt
        run: |
          {
            echo 'PR_REVIEW_PROMPT<<PROMPT_EOF'
            cat .github/prompts/pr-test-review.md
            echo PROMPT_EOF
          } >> "$GITHUB_ENV"

      - name: Review PR against test framework conventions
        uses: anthropics/claude-code-action@v1
        with:
          # Generated via `claude setup-token` (uses your Claude subscription, no separate
          # API billing). Swap for `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`
          # if you'd rather use Console API billing instead.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ env.PR_REVIEW_PROMPT }}

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
