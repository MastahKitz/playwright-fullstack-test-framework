name: QA Triage

# Runs after "Playwright Tests" finishes. One workflow, three jobs:
#
#   qa-results-analysis     — only on a failed/flaky run: triages the failures,
#                             files issues, opens the combined triage PR and the
#                             draft decision PR.
#   qa-issue-marker-cleanup — on every completed run: removes KNOWN-FAILURE
#                             markers whose test went green, reconciles the issues.
#                             Plain script (scripts/cleanup-fully-fixed-issue-markers.js),
#                             not an agent — the decision logic is table-lookup, no
#                             judgment call an LLM would change the outcome of.
#   publish-triage-metrics  — only on a failed/flaky run, after analysis: reads
#                             the issues/PRs analysis just filed (or didn't) and
#                             publishes this run's decision counts to the
#                             dashboard's triage-metrics table
#                             (scripts/publish-triage-metrics.js).
#
# `qa-issue-marker-cleanup` `needs` `qa-results-analysis`, so on a failing run it
# runs *after* analysis — its tracking inventory then includes the triage PR
# analysis just opened, which the issue-close guard depends on. On a passing run
# analysis is skipped and cleanup runs straight away (`if: !cancelled()`).
# `publish-triage-metrics` also `needs` `qa-results-analysis`, but unlike cleanup
# it only runs on a failing run — a passing run never triages anything, so
# there's nothing to publish (as opposed to a failing run that triaged and found
# nothing new, which is a real zero worth recording).
#
# Split from playwright.yml because Claude Code Action can't be triggered by
# `push`; `workflow_run` is supported, so this watches that event and pulls the
# upstream run's artifacts across.
on:
  workflow_run:
    workflows: ['Playwright Tests']
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

# No-cancel group so two stacked Playwright runs can't drive two triage passes
# concurrently — no duplicate issues, no duplicate PRs, no racing issue-close.
concurrency:
  group: qa-triage-automation
  cancel-in-progress: false

jobs:
  qa-results-analysis:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download test report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: test-report/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download failure screenshots
        uses: actions/download-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Extract video frames from failed attempts
        run: |
          shopt -s globstar nullglob
          for video in test-results/**/video.webm; do
            dir=$(dirname "$video")
            mkdir -p "$dir/video-frames"
            ffmpeg -loglevel error -i "$video" -vf fps=2 "$dir/video-frames/frame-%03d.png"
          done

      # Flatten the nested JSON report into one entry per failing/flaky test so
      # the model works from a clean list. No stack parsing, no anchor — the
      # marker lives at the test-case level now, keyed on spec + title.
      - name: List run failures
        run: |
          node scripts/list-run-failures.js test-report/results.json > run-failures.json
          echo "::group::run-failures.json"
          cat run-failures.json
          echo "::endgroup::"

      - name: Ensure triage labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh label create qa-triage --force \
            --color BFD4F2 --description "Opened by the QA triage automation"
          gh label create qa-triage:triage --force \
            --color 1D76DB --description "QA triage — confident issue or combined PR"
          gh label create qa-triage:decision --force \
            --color 5319E7 --description "QA triage — decision issue or draft PR"

      # Build the shared tracking inventory (issues + the three PR lists +
      # markers, all keyed on spec + title). One controlled set of API calls,
      # compacted so the model matches locally in Step 1.
      - name: Build tracking inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue list --state open --label qa-triage --limit 200 \
            --json number,title,body > issues.json
          gh pr list --state open --label qa-triage --limit 200 \
            --json number,title,headRefName,body,labels > prs.json
          grep -rn --include='*.ts' 'KNOWN-FAILURE(#' tests/functional/ > markers.txt || true
          node scripts/build-tracking-inventory.js \
            issues.json prs.json markers.txt > tracking-inventory.json
          rm -f issues.json prs.json markers.txt
          echo "::group::tracking-inventory.json"
          cat tracking-inventory.json
          echo "::endgroup::"

      - name: Load failure analysis prompt
        run: |
          {
            echo 'FAILURE_ANALYSIS_PROMPT<<PROMPT_EOF'
            cat .github/prompts/qa-results-analysis.md
            echo PROMPT_EOF
          } >> "$GITHUB_ENV"

      - name: Analyze test failures
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            RUN ID: ${{ github.event.workflow_run.id }}
            RUN URL: ${{ github.event.workflow_run.html_url }}
            COMMIT: ${{ github.event.workflow_run.head_sha }}

            ${{ env.FAILURE_ANALYSIS_PROMPT }}

          claude_args: |
            --allowedTools "Read,Grep,Glob,Edit,Bash(git checkout:*),Bash(git config:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue create:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*)"

  qa-issue-marker-cleanup:
    needs: [qa-results-analysis]
    # Runs after analysis on a failing run (so the inventory sees analysis's new
    # triage PR), and straight away on a passing run (analysis skipped). Only the
    # real pass/fail outcomes — not a cancelled or skipped Playwright run.
    if: >
      !cancelled() &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download test report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: test-report/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure triage labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh label create qa-triage --force \
            --color BFD4F2 --description "Opened by the QA triage automation"
          gh label create qa-triage:cleanup --force \
            --color 0E8A16 --description "QA triage — marker-removal PR"

      # The same shared inventory builder, all five lists. Cleanup needs the PR
      # lists too: cleanup_prs for the dedup check, triage_prs / decision_prs for
      # the "don't close an issue a pending PR still references" check — which is
      # why this job runs after qa-results-analysis.
      - name: Build tracking inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue list --state open --label qa-triage --limit 200 \
            --json number,title,body > issues.json
          gh pr list --state open --label qa-triage --limit 200 \
            --json number,title,headRefName,body,labels > prs.json
          grep -rn --include='*.ts' 'KNOWN-FAILURE(#' tests/functional/ > markers.txt || true
          node scripts/build-tracking-inventory.js \
            issues.json prs.json markers.txt > tracking-inventory.json
          rm -f issues.json prs.json markers.txt
          echo "::group::tracking-inventory.json"
          cat tracking-inventory.json
          echo "::endgroup::"

      # Deterministic table-lookup + set-membership logic (scripts/cleanup-fully-fixed-issue-markers.js) —
      # no case where a model's judgment changes the outcome, so this runs as a plain
      # script instead of an agent. See the script's header for the full rundown.
      - name: Retire markers and issues that are already fully fixed and passing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: node scripts/cleanup-fully-fixed-issue-markers.js tracking-inventory.json test-report/results.json

  publish-triage-metrics:
    needs: [qa-results-analysis]
    # Only on a failing run, and only after analysis has actually filed
    # whatever it's going to file — a passing run never triages anything, so
    # there's nothing here to publish (see the top-of-file note).
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # gh-pages is checked out fresh here — this job doesn't share a
      # checkout with qa-results-analysis — and the publish below is retried
      # on a rejected push, because playwright.yml's own dashboard publish
      # force-pushes the same branch independently and could race this job.
      - name: Check out dashboard site
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish triage metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          if [ ! -d gh-pages ]; then
            echo "No gh-pages checkout (dashboard not published yet) — skipping."
            exit 0
          fi
          # Valid bugs / unsure come straight from GitHub's own state: every
          # issue analysis files carries qa-triage plus its confident/decision
          # type label and a `Run: #<RUN ID>` line, so no PR-body parsing is
          # needed to tell them apart or to scope them to this run. Script
          # errors have no issue to check against — that count still comes
          # from the combined PR's own `script-issue-groups:` line.
          gh issue list --state open --label qa-triage \
            --json number,body,labels --limit 200 > qa-issues.json
          gh pr list --state open --label qa-triage \
            --json number,title,body,labels --limit 50 > qa-prs.json
          git -C gh-pages config user.name 'github-actions[bot]'
          git -C gh-pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            node scripts/publish-triage-metrics.js qa-issues.json qa-prs.json gh-pages
            git -C gh-pages add triage-history.json index.html
            if git -C gh-pages diff --cached --quiet; then
              echo "No triage metrics change to publish."
              break
            fi
            git -C gh-pages commit -q -m "triage metrics: run #${UPSTREAM_RUN_NUMBER}"
            if git -C gh-pages push \
                "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                HEAD:gh-pages; then
              echo "Published."
              break
            fi
            echo "Push rejected (concurrent dashboard publish) — refetching and retrying ($attempt)."
            git -C gh-pages fetch origin gh-pages
            git -C gh-pages reset --hard origin/gh-pages
          done
