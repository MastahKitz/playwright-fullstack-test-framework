name: QA Test Generation (pilot)

# Manual, one-ticket-at-a-time pilot for AI-driven test case generation. Two
# jobs:
#
#   fetch-ticket    — deterministic prep: given one Jira key, fetch it plus
#                     its epic/parent and explicitly linked issues (one level
#                     deep, no project-wide search — see
#                     scripts/fetch-jira-ticket.js's header), download any
#                     image/video attachments, print the resulting JSON so it
#                     can be eyeballed, and hand it off as an artifact.
#   generate-tests  — hands the ticket to Claude: identify what scenarios the
#                     story implies, check them against the existing suite,
#                     write the confident ones as real test code in a PR, and
#                     open an issue asking a human for anything ambiguous
#                     instead of guessing. See .github/prompts/qa-test-generation.md.
#                     Neither job runs the new tests — playwright.yml only
#                     triggers on push to main, so that happens after merge,
#                     same as any other test change; if a generated test then
#                     fails or flakes, qa-triage.yml picks it up like any
#                     other failure.
on:
  workflow_dispatch:
    inputs:
      ticket:
        description: 'Jira ticket key (e.g. DEV-1)'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  fetch-ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Jira ticket
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          node scripts/fetch-jira-ticket.js "${{ inputs.ticket }}" jira-attachments > jira-ticket.json
          echo "::group::jira-ticket.json"
          cat jira-ticket.json
          echo "::endgroup::"

      - name: Upload ticket JSON + attachments
        uses: actions/upload-artifact@v4
        with:
          name: jira-ticket-${{ inputs.ticket }}
          path: |
            jira-ticket.json
            jira-attachments/
          if-no-files-found: ignore

  generate-tests:
    needs: fetch-ticket
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download ticket JSON + attachments
        uses: actions/download-artifact@v4
        with:
          name: jira-ticket-${{ inputs.ticket }}
          path: .

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Extract video frames from any video attachments
        run: |
          if [ -d jira-attachments ]; then
            shopt -s nullglob
            for video in jira-attachments/*.mp4 jira-attachments/*.mov jira-attachments/*.webm jira-attachments/*.mkv jira-attachments/*.avi; do
              base=$(basename "$video")
              name="${base%.*}"
              outdir="jira-attachments/video-frames/$name"
              mkdir -p "$outdir"
              ffmpeg -loglevel error -i "$video" -vf fps=2 "$outdir/frame-%03d.png"
            done
          fi

      - name: Ensure test-generation label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create qa-test-generation --force \
            --color F9D0C4 --description "Opened by the QA test-generation automation"

      # Ticket text only ever says WHAT is expected — HOW it's actually built (real
      # testids, real DOM structure, real flow) is something the app itself has to
      # answer. Installed here (not via the repo's own package.json) because
      # @playwright/mcp pulls its own pinned playwright-core; installing browsers
      # against whatever `playwright` npx resolves keeps that pairing consistent.
      - name: Install Playwright browsers for the MCP server
        run: npx --yes playwright install --with-deps chromium

      - name: Compute admin password's daily date suffix
        id: admin-date-suffix
        # Mirrors tests/functional/auth/auth.data.ts's todayDateSuffix(): DDMMYYYY.
        run: echo "suffix=$(date +%d%m%Y)" >> "$GITHUB_OUTPUT"

      - name: Load test-generation prompt
        # The prompt references docs/conventions.md as the source of truth; inline it
        # here so the conventions are guaranteed to be in context, not just fetchable.
        run: |
          {
            echo 'TEST_GENERATION_PROMPT<<PROMPT_EOF'
            cat .github/prompts/qa-test-generation.md
            echo
            echo '---'
            echo '# docs/conventions.md'
            echo
            cat docs/conventions.md
            echo PROMPT_EOF
          } >> "$GITHUB_ENV"

      - name: Identify and generate test coverage
        env:
          # For logging into the live app to ground HOW a feature works — real
          # testids, real flow — never to decide WHAT the correct behavior is
          # (that's the ticket's job). Same accounts the Playwright suite itself
          # uses (tests/functional/auth/auth.data.ts); admin's password rotates
          # daily by date suffix, computed the same way that file computes it.
          STANDARD_USER_USERNAME: ${{ secrets.QA_STANDARD_USER_USERNAME }}
          STANDARD_USER_PASSWORD: ${{ secrets.QA_STANDARD_USER_PASSWORD }}
          ADMIN_USER_USERNAME: ${{ secrets.QA_ADMIN_USER_USERNAME }}
          ADMIN_USER_PASSWORD: ${{ secrets.QA_ADMIN_USER_PASSWORD_PREFIX }}${{ steps.admin-date-suffix.outputs.suffix }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            TICKET: ${{ inputs.ticket }}
            RUN NUMBER: ${{ github.run_number }}
            APP BASE URL: https://qademo.com
            STANDARD USER LOGIN: ${{ env.STANDARD_USER_USERNAME }} / ${{ env.STANDARD_USER_PASSWORD }}
            ADMIN USER LOGIN: ${{ env.ADMIN_USER_USERNAME }} / ${{ env.ADMIN_USER_PASSWORD }}

            ${{ env.TEST_GENERATION_PROMPT }}

          claude_args: |
            --mcp-config '{"mcpServers":{"playwright":{"command":"npx","args":["-y","@playwright/mcp@latest","--headless","--isolated","--browser","chromium"]}}}'
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git checkout:*),Bash(git config:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh issue create:*),mcp__playwright__browser_navigate,mcp__playwright__browser_click,mcp__playwright__browser_type,mcp__playwright__browser_snapshot,mcp__playwright__browser_evaluate,mcp__playwright__browser_wait_for,mcp__playwright__browser_press_key,mcp__playwright__browser_select_option,mcp__playwright__browser_fill_form,mcp__playwright__browser_take_screenshot,mcp__playwright__browser_tabs,mcp__playwright__browser_network_requests,mcp__playwright__browser_close"
